    - rule_5.1.6
    - NIST800-53R5_SC-8
  block:
    - name: "5.1.6 | PATCH | Ensure sshd Ciphers are configured | Add submodule exclusion"
      ansible.builtin.template:
        src: etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod.j2
        dest: /etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod
        owner: root
        group: root
        mode: 'go-rwx'
      notify:
        - Update Crypto Policy
        - Set Crypto Policy

    - name: "5.1.6 | PATCH | Ensure sshd Ciphers are configured | submodule to crypto policy modules"
      ansible.builtin.set_fact:
        suse16cis_crypto_policy_module: "{{ suse16cis_crypto_policy_module + ':NO-SSHWEAKCIPHERS' }}"

