---

- name: "5.1.1 | PATCH | Ensure access to sshd_config files is configured"
  when: suse16cis_rule_5_1_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - ssh
    - permissions
    - rule_5.1.1
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "5.1.1 | AUDIT | Ensure access to sshd_config files is configured | find all config files"
      ansible.builtin.find:
        paths:
          - /etc/ssh/sshd_config.d
          - /usr/etc/ssh/sshd_config.d
        patterns: '*.conf'
      register: discovered_sshd_config

    - name: "5.1.1 | PATCH | Ensure access to sshd_config files is configured | Set permissions on sshd_config"
      when: item.path is defined
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-rwx'
      failed_when: discovered_sshd_config_permissions.state not in '[ file, absent ]'
      register: discovered_sshd_config_permissions
      loop: "{{ discovered_sshd_config.files + [{'path': '/etc/ssh/sshd_config'}, {'path': '/usr/etc/ssh/sshd_config'}] }}"

- name: "5.1.2 | PATCH | Ensure access to SSH private host key files is configured"
  when: suse16cis_rule_5_1_2
  tags:
    - level1-server
    - level1-workstation
    - patch
    - ssh
    - permissions
    - rule_5.1.2
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "5.1.2 | AUDIT | Ensure access to SSH private host key files is configured | Find the SSH private host keys"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key'
        recurse: true
        file_type: any
      register: discovered_ssh_private_host_key

    - name: "5.1.2 | PATCH | Ensure access to SSH private host key files is configured | Set permissions on SSH private host keys"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-rwx'
      loop: "{{ discovered_ssh_private_host_key.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: "5.1.3 | PATCH | Ensure access to SSH public host key files is configured"
  when: suse16cis_rule_5_1_3
  tags:
    - level1-server
    - level1-workstation
    - patch
    - ssh
    - rule_5.1.3
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "5.1.3 | AUDIT | Ensure access to SSH public host key files is configured | Find the SSH public host keys"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key.pub'
        recurse: true
        file_type: any
      register: discovered_ssh_public_host_key

    - name: "5.1.3 | PATCH | Ensure access to SSH public host key files is configured | Set permissions on SSH public host keys"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: 'u-x,go-wx'
      loop: "{{ discovered_ssh_public_host_key.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: "5.1.4 | PATCH | Ensure sshd access is configured"
  when: suse16cis_rule_5_1_4
  tags:
    - level1-server
    - level1-workstation
    - patch
    - ssh
    - rule_5.1.4
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add line to sshd_config for allowusers"
      when: "suse16cis_sshd_allow_users | length > 0"
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/allow_users.conf
        regexp: "^AllowUsers"
        line: "AllowUsers {{ suse16cis_sshd_allow_users }}"
        create: true
        owner: root
        group: root
        mode: 'u-x,go-rwx'
        validate: sshd -t -f %s
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add line to sshd_config for allowgroups"
      when: "suse16cis_sshd_allow_groups | length > 0"
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/allow_groups.conf
        regexp: "^AllowGroups"
        line: "AllowGroups {{ suse16cis_sshd_allow_groups }}"
        create: true
        owner: root
        group: root
        mode: 'u-x,go-rwx'
        validate: sshd -t -f %s
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add line to sshd_config for denyusers"
      when: "suse16cis_sshd_deny_users | length > 0"
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/deny_users.conf
        regexp: "^DenyUsers"
        line: "DenyUsers {{ suse16cis_sshd_deny_users }}"
        create: true
        owner: root
        group: root
        mode: 'u-x,go-rwx'
        validate: sshd -t -f %s
      notify: Restart sshd

    - name: "5.1.4 | PATCH | Ensure sshd access is configured | Add line to sshd_config for denygroups"
      when: "suse16cis_sshd_deny_groups | length > 0"
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/deny_groups.conf
        regexp: "^DenyGroups"
        line: "DenyGroups {{ suse16cis_sshd_deny_groups }}"
        create: true
        owner: root
        group: root
        mode: 'u-x,go-rwx'
        validate: sshd -t -f %s
      notify: Restart sshd

