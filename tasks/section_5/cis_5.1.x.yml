    - name: "5.1.24 | PATCH | Ensure sshd ListenAddress is configured | Apply if address configured"
      when: suse16cis_sshd_listen_address | length > 0
      ansible.builtin.lineinfile:
        path: "{{ suse16cis_sshd_config_file }}"
        regexp: (?i)^(#|)\s*ListenAddress
        line: "ListenAddress {{ suse16cis_sshd_listen_address }}"
        validate: sshd -t -f %s
      notify: Restart sshd

    - name: "5.1.24 | PATCH | Ensure sshd ListenAddress is configured | Warn if not configured"
      when: suse16cis_sshd_listen_address | length == 0
      ansible.builtin.debug:
        msg: "Warning!! suse16cis_sshd_listen_address is not set. Set it to a private network interface address to comply with 5.1.24."

    - name: "5.1.24 | PATCH | Ensure sshd ListenAddress is configured | Warn Count"
      when: suse16cis_sshd_listen_address | length == 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '5.1.24'
