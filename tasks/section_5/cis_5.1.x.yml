- name: "5.1.23 | PATCH | Ensure sshd post-quantum cryptography key exchange algorithms are configured"
  when: suse16cis_rule_5_1_23
  tags:
    - level1-server
    - level1-workstation
    - patch
    - ssh
    - rule_5.1.23
  block:
    - name: "5.1.23 | AUDIT | Ensure sshd post-quantum cryptography key exchange algorithms are configured | Verify sntrup761 kex is available"
      ansible.builtin.command: sshd -T
      changed_when: false
      register: discovered_sshd_kexalgorithms

    - name: "5.1.23 | AUDIT | Ensure sshd post-quantum cryptography key exchange algorithms are configured | Warn if post-quantum kex missing"
      when: "'sntrup761x25519-sha512' not in discovered_sshd_kexalgorithms.stdout"
      ansible.builtin.debug:
        msg: "Warning!! Post-quantum KexAlgorithm sntrup761x25519-sha512 not present in sshd -T output for control 5.1.23."

    - name: "5.1.23 | AUDIT | Ensure sshd post-quantum cryptography key exchange algorithms are configured | Warn Count"
      when: "'sntrup761x25519-sha512' not in discovered_sshd_kexalgorithms.stdout"
      ansible.builtin.import_tasks:
        file: warning_facts.yml

