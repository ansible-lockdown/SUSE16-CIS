---

- name: "6.1.2.1 | PATCH | Ensure rsyslog is installed"
  when: suse16cis_rule_6_1_2_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rsyslog
    - rule_6.1.2.1
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-3
    - NIST800-53R5_AU-12
  ansible.builtin.package:
    name: rsyslog
    state: present

- name: "6.1.2.2 | PATCH | Ensure rsyslog service is enabled and active"
  when: suse16cis_rule_6_1_2_2
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rsyslog
    - rule_6.1.2.2
    - NIST800-53R5_CM-6
  ansible.builtin.systemd:
    name: rsyslog
    masked: false
    enabled: true
    state: started

- name: "6.1.2.3 | PATCH | Ensure journald is configured to send logs to rsyslog"
  when:
    - suse16cis_rule_6_1_2_3
    - suse16cis_syslog == "rsyslog"
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rsyslog
    - rule_6.1.2.3
    - NIST800-53R5_AC-3
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-4
    - NIST800-53R5_AU-12
    - NIST800-53R5_MP-2
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: "^#ForwardToSyslog=|^ForwardToSyslog="
    line: ForwardToSyslog=yes
  notify: Restart rsyslog

- name: "6.1.2.4 | PATCH | Ensure rsyslog log file creation mode is configured"
  when: suse16cis_rule_6_1_2_4
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rsyslog
    - rule_6.1.2.4
    - NIST800-53R5_AC-3
    - NIST800-53R5_AC-6
    - NIST800-53R5_MP-2
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.conf
    regexp: "^\\$FileCreateMode"
    line: "$FileCreateMode 0640"
  notify: Restart rsyslog

- name: "6.1.2.5 | AUDIT | Ensure rsyslog logging is configured"
  when: suse16cis_rule_6_1_2_5
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_6.1.2.5
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  block:
    - name: "6.1.2.5 | AUDIT | Ensure rsyslog logging is configured | rsyslog current config message out"
      ansible.builtin.shell: |
        set -o pipefail
        cat /etc/rsyslog.conf | grep -Ev "^#|^$"
      changed_when: false
      failed_when: false
      check_mode: false
      args:
        executable: "{{ suse16cis_shell_executable }}"
      register: discovered_configured_rsyslog

    - name: "6.1.2.5 | AUDIT | Ensure rsyslog logging is configured | rsyslog current config message out"
      ansible.builtin.debug:
        msg:
          - "These are the current logging configurations for rsyslog, please review:"
          - "{{ discovered_configured_rsyslog.stdout_lines }}"

    - name: "6.1.2.5 | PATCH | Ensure rsyslog logging is configured | mail.* log setting"
      when: suse16cis_rsyslog_ansiblemanaged
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.conf
        marker: "# {mark} MAIL LOG SETTINGS - CIS benchmark - Ansible-lockdown"
        block: |
          # mail logging additions to meet CIS standards
          mail.*                                                  -/var/log/mail
          mail.info                                               -/var/log/mail.info
          mail.warning                                            -/var/log/mail.warning
          mail.err                                                /var/log/mail.err
        insertafter: "# Log all the mail messages in one place."
      notify: Restart rsyslog

    - name: "6.1.2.5 | PATCH | Ensure rsyslog logging is configured | Misc. log setting"
      when: suse16cis_rsyslog_ansiblemanaged
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.conf
        state: present
        marker: "# {mark} MISC. LOG SETTINGS - CIS benchmark - Ansible-lockdown"
        block: |
          # misc. logging additions to meet CIS standards
          *.=warning;*.=err                                        -/var/log/warn
          *.crit                                                   /var/log/warn
          *.*;mail.none;news.none                                  /var/log/messages
        insertafter: "#### RULES ####"
      notify: Restart rsyslog

    - name: "6.1.2.5 | PATCH | Ensure rsyslog logging is configured | Local log settings"
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.conf
        state: present
        marker: "#{mark} LOCAL LOG SETTINGS - CIS benchmark - Ansible-lockdown"
        block: |
          # local log settings to meet CIS standards
          local0,local1.*                                          -/var/log/localmessages
          local2,local3.*                                          -/var/log/localmessages
          local4,local5.*                                          -/var/log/localmessages
          local6,local7.*                                          -/var/log/localmessages
          *.emerg                                                    :omusrmsg:*
        insertafter: "#### RULES ####"
      notify: Restart rsyslog

    - name: "6.1.2.5 | PATCH | Ensure rsyslog logging is configured | Auth Settings"
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.conf
        state: present
        marker: "#{mark} Auth SETTINGS - CIS benchmark - Ansible-lockdown"
        block: |
          # Private settings to meet CIS standards
          auth,authpriv.*                                           /var/log/secure
        insertafter: "#### RULES ####"
      notify: Restart rsyslog

    - name: "6.1.2.5 | PATCH | Ensure rsyslog logging is configured | Cron Settings"
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.conf
        state: present
        marker: "#{mark} Cron SETTINGS - CIS benchmark - Ansible-lockdown"
        block: |
          # Cron settings to meet CIS standards
          cron.*                                                   /var/log/cron
        insertafter: "#### RULES ####"
      notify: Restart rsyslog

- name: "6.1.2.6 | PATCH | Ensure rsyslog is configured to send logs to a remote log host"
  when:
    - suse16cis_rule_6_1_2_6
    - suse16cis_remote_log_server
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rsyslog
    - rule_6.1.2.6
    - NIST800-53R5_AU-6
  ansible.builtin.blockinfile:
    path: /etc/rsyslog.conf
    state: present
    block: |
      # target can be IP or FQDN
      *.* action(type="omfwd" target="{{ suse16cis_remote_log_host }}" port="{{ suse16cis_remote_log_port }}" protocol="{{ suse16cis_remote_log_protocol }}" action.resumeRetryCount="{{ suse16cis_remote_log_retrycount }}" queue.type="LinkedList" queue.size="{{ suse16cis_remote_log_queuesize }}")
    insertafter: EOF
  failed_when:
    - discovered_rsyslog_remote_host is failed
    - discovered_rsyslog_remote_host.rc != 257
  register: discovered_rsyslog_remote_host
  notify: Restart rsyslog

- name: "6.1.2.7 | PATCH | Ensure rsyslog is not configured to receive logs from a remote client"
  when: suse16cis_rule_6_1_2_7
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rsyslog
    - rule_6.1.2.7
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
    - NIST800-53R5_CM-6
  block:
    - name: "6.1.2.7 | PATCH | Ensure rsyslog is not configured to receive logs from a remote client | When not log host"
      when: not suse16cis_system_is_log_server
      ansible.builtin.replace:
        path: /etc/rsyslog.conf
        regexp: "{{ item }}"
        replace: "#\\1"
      notify: Restart rsyslog
      loop:
        - "^(\\$ModLoad imtcp)"
        - "^(\\$InputTCPServerRun)"
        - '^(module\(load="imtcp"\))'
        - '^(input\(type="imtcp")'

    - name: "6.1.2.7 | PATCH | Ensure rsyslog is not configured to receive logs from a remote client | When log host"
      when: suse16cis_system_is_log_server
      ansible.builtin.lineinfile:
        path: /etc/rsyslog.conf
        regexp: ^(.*{{ item }}.*)
        line: "{{ item }}"
      notify: Restart rsyslog
      loop:
        - module(load="imtcp")
        - input(type="imtcp" port="514")
      loop_control:
        label: "{{ item }}"

- name: "6.1.2.8 | AUDIT | Ensure logrotate is configured"
  when: suse16cis_rule_6_1_2_8
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_6.1.2.8
    - NIST800-53R5_AU-8
  block:
    - name: "6.1.2.8 | PATCH | Ensure logrotate is configured | installed"
      ansible.builtin.package:
        name: logrotate
        state: present

    - name: "6.1.2.8 | PATCH | Ensure logrotate is configured | scheduled"
      ansible.builtin.systemd:
        name: logrotate.timer
        state: started
        enabled: true

    - name: "6.1.2.8 | PATCH | Ensure logrotate is configured | set rsyslog conf"
      ansible.builtin.template:
        src: etc/logrotate.d/rsyslog.conf.j2
        dest: /etc/logrotate.d/rsyslog.conf
        owner: root
        group: root
        mode: 'u-x,g-wx,o-rwx'

- name: "6.1.2.9 | PATCH | Ensure rsyslog-gnutls is installed"
  when: suse16cis_rule_6_1_2_9
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rsyslog
    - rule_6.1.2.9
  ansible.builtin.package:
    name: rsyslog-module-gtls
    state: present

- name: "6.1.2.10 | PATCH | Ensure rsyslog forwarding uses gtls"
  when: suse16cis_rule_6_1_2_10
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rsyslog
    - rule_6.1.2.10
  ansible.builtin.blockinfile:
    path: /etc/rsyslog.conf
    state: present
    marker: "# {mark} GTLS FORWARDING - CIS benchmark - Ansible-lockdown"
    block: |
      $DefaultNetstreamDriver gtls
      $DefaultNetstreamDriverCAFile {{ suse16cis_rsyslog_gtls_ca_file }}
      $DefaultNetstreamDriverCertFile {{ suse16cis_rsyslog_gtls_cert_file }}
      $DefaultNetstreamDriverKeyFile {{ suse16cis_rsyslog_gtls_key_file }}
      $ActionSendStreamDriverMode 1
      $ActionSendStreamDriverAuthMode anon
    insertafter: "#### MODULES ####"
  notify: Restart rsyslog

- name: "6.1.2.11 | AUDIT | Ensure rsyslog CA certificates are configured"
  when: suse16cis_rule_6_1_2_11
  tags:
    - level2-server
    - level2-workstation
    - audit
    - rule_6.1.2.11
  block:
    - name: "6.1.2.11 | AUDIT | Ensure rsyslog CA certificates are configured | Warn"
      ansible.builtin.debug:
        msg: "Warning!! Manual intervention required - Ensure CA certificates for rsyslog TLS forwarding are in place: {{ suse16cis_rsyslog_gtls_ca_file }}, {{ suse16cis_rsyslog_gtls_cert_file }}, {{ suse16cis_rsyslog_gtls_key_file }}"

    - name: "6.1.2.11 | AUDIT | Ensure rsyslog CA certificates are configured | Warn Count"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '6.1.2.11'
