---

- name: "6.1.1.1 | PATCH | Ensure journald service is active"
  when: suse16cis_rule_6_1_1_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_6.1.1.1
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  ansible.builtin.systemd:
    name: systemd-journald.service
    masked: false
    state: started

- name: "6.1.1.2 | PATCH | Ensure systemd-journal-remote service is not in use"
  when: suse16cis_rule_6_1_1_2
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_6.1.1.2
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  block:
    - name: "6.1.1.2 | PATCH | Ensure systemd-journal-remote service is not in use | Mask socket"
      ansible.builtin.systemd:
        name: systemd-journal-remote.socket
        masked: true
        state: stopped
        enabled: false
      failed_when: false

    - name: "6.1.1.2 | PATCH | Ensure systemd-journal-remote service is not in use | Mask service"
      ansible.builtin.systemd:
        name: systemd-journal-remote.service
        masked: true
        state: stopped
        enabled: false
      failed_when: false

- name: "6.1.1.3 | PATCH | Ensure journald Compress is configured"
  when: suse16cis_rule_6_1_1_3
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_6.1.1.3
    - NIST800-53R5_AU-4
  notify: Restart journald
  block:
    - name: "6.1.1.3 | PATCH | Ensure journald Compress is configured | Add file"
      ansible.builtin.template:
        src: etc/systemd/journald.conf.d/storage.conf.j2
        dest: "/etc/systemd/journald.conf.d/{{ suse16cis_journald_storage }}"
        owner: root
        group: root
        mode: 'u-x,g-wx,o-rwx'

    - name: "6.1.1.3 | PATCH | Ensure journald Compress is configured | Comment out current entries"
      when:
        - prelim_journald_conf_files is defined
        - "suse16cis_journald_storage not in item.path"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: (?i)^(\s*compress=)
        replace: "#\\1"
      loop: "{{ prelim_journald_conf_files.files }}"
      loop_control:
        label: "{{ item }}"

- name: "6.1.1.4 | PATCH | Ensure journald Storage is configured"
  when: suse16cis_rule_6_1_1_4
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_6.1.1.4
    - NIST800-53R5_AU-3
    - NIST800-53R5_AU-12
  notify: Restart journald
  block:
    - name: "6.1.1.4 | PATCH | Ensure journald Storage is configured | Add file"
      ansible.builtin.template:
        src: etc/systemd/journald.conf.d/storage.conf.j2
        dest: "/etc/systemd/journald.conf.d/{{ suse16cis_journald_storage }}"
        owner: root
        group: root
        mode: 'u-x,g-wx,o-rwx'

    - name: "6.1.1.4 | PATCH | Ensure journald Storage is configured | Comment out current entries"
      when:
        - prelim_journald_conf_files is defined
        - "suse16cis_journald_storage not in item.path"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: (?i)^(\s*storage=)
        replace: "#\\1"
      loop: "{{ prelim_journald_conf_files.files }}"
      loop_control:
        label: "{{ item }}"

- name: "6.1.1.5 | PATCH | Ensure journald is configured to send logs to rsyslog"
  when:
    - suse16cis_rule_6_1_1_5
    - suse16cis_syslog == "rsyslog"
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_6.1.1.5
    - NIST800-53R5_AC-3
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-4
    - NIST800-53R5_AU-12
    - NIST800-53R5_MP-2
  notify: Restart journald
  ansible.builtin.template:
    src: etc/systemd/journald.conf.d/forwardtosyslog.conf.j2
    dest: "/etc/systemd/journald.conf.d/{{ suse16cis_journald_forwardsyslog }}"
    owner: root
    group: root
    mode: 'u-x,g-wx,o-rwx'

- name: "6.1.1.6 | AUDIT | Ensure journald log file rotation is configured"
  when: suse16cis_rule_6_1_1_6
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_6.1.1.6
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-7
    - NIST800-53R5_AU-12
  block:
    - name: "6.1.1.6 | AUDIT | Ensure journald log file rotation is configured"
      ansible.builtin.template:
        src: etc/systemd/journald.conf.d/rotation.conf.j2
        dest: /etc/systemd/journald.conf.d/rotation.conf
        owner: root
        group: root
        mode: 'u-x,g-wx,o-rwx'

    - name: "6.1.1.6 | AUDIT | Ensure journald log file rotation is configured | comment out current entries"
      ansible.builtin.lineinfile:
        path: /etc/systemd/journald.conf
        regexp: "{{ item }}"
        line: "#\\1"
        backrefs: true
      failed_when: discovered_journald_conf.rc not in [ 0, 257 ]
      register: discovered_journald_conf
      loop:
        - "^(\\s*SystemMaxUse\\s*=.*)"
        - "^(\\s*SystemKeepFree\\s*=.*)"
        - "^(\\s*RuntimeMaxUse\\s*=)"
        - "^(\\s*RuntimeKeepFree\\s*=.*)"
        - "^(\\s*MaxFileSec\\s*=.*)"

- name: "6.1.1.7 | AUDIT | Ensure journald log file access is configured"
  when: suse16cis_rule_6_1_1_7
  tags:
    - level1-server
    - level1-workstation
    - audit
    - rule_6.1.1.7
    - NIST800-53R5_AC-3
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-12
    - NIST800-53R5_MP-2
    - NIST800-53R5_SI-5
  block:
    - name: "6.1.1.7 | AUDIT | Ensure journald log file access is configured"
      ansible.builtin.shell: |
        set -o pipefail
        grep -P '^(f|z|Z)(?:\+!?|!)?\s+\S+\s+~?[0-7]?[0-7]?[0-7]?(?:[1-7])\s' /usr/lib/tmpfiles.d/systemd.conf | wc -l
      args:
        executable: "{{ suse16cis_shell_executable }}"
      failed_when: false
      changed_when: false
      register: discovered_file_perm_count

    - name: "6.1.1.7 | AUDIT | Ensure journald log file access is configured | Check for override file"
      ansible.builtin.stat:
        path: /etc/tmpfiles.d/systemd.conf
      register: discovered_tmpfile_override

    - name: "6.1.1.7 | AUDIT | Ensure journald log file access is configured | Count every permission over 0640 in override file"
      when: discovered_tmpfile_override.stat.exists
      ansible.builtin.shell: |
        set -o pipefail
        grep -P '^(f|z|Z)(?:\+!?|!)?\s+\S+\s+~?[0-7]?[0-7]?[0-7]?(?:[1-7])\s' /etc/tmpfiles.d/systemd.conf | wc -l
      args:
        executable: "{{ suse16cis_shell_executable }}"
      failed_when: false
      changed_when: false
      register: discovered_override_file_perm_count

    - name: "6.1.1.7 | AUDIT | Ensure journald log file access is configured | Warning policy not matching benchmark"
      when: (discovered_file_perm_count.stdout | int) > 0
      ansible.builtin.debug:
        msg: "Warning!! - /usr/lib/tmpfiles.d/systemd.conf affecting journald files please confirm matches site policy"

    - name: "6.1.1.7 | AUDIT | Ensure journald log file access is configured | Warning if override found"
      when:
        - discovered_tmpfile_override.stat.exists
        - (discovered_override_file_perm_count.stdout | int) > 0
      ansible.builtin.debug:
        msg: "Warning!! - tmpfiles override found in /etc/tmpfiles.d/systemd.conf affecting journald files please confirm matches site policy"

    - name: "6.1.1.7 | AUDIT | Ensure journald log file access is configured | Warning if override found"
      when: (discovered_file_perm_count.stdout | int) > 0 or ( discovered_tmpfile_override.stat.exists and discovered_file_perm_count.stdout | int > 0)
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: "6.1.1.7"
