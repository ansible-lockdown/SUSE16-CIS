---

- name: "1.3.1.1 | PATCH | Ensure SELinux is installed"
  when: suse16cis_rule_1_3_1_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.3.1.1
    - NIST800-53R5_AC-3
    - selinux
  ansible.builtin.package:
    name: libselinux1
    state: present

- name: "1.3.1.2 | PATCH | Ensure SELinux is not disabled in bootloader configuration"
  when: suse16cis_rule_1_3_1_2
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.3.1.2
    - NIST800-53R5_AC-3
    - selinux
  block:
    - name: "1.3.1.2 | PATCH | Ensure SELinux is not disabled in bootloader configuration | Update existing settings"
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX="(?:[^"\n]*[ \t])?{{ item.name }}=)(?!{{ item.value }}[ \t"])[^ \t"\n]*'
        replace: '\g<1>{{ item.value }}'
      loop:
        - { name: selinux, value: '1' }
        - { name: security, value: selinux }
      notify: Grub update

    - name: "1.3.1.2 | PATCH | Ensure SELinux is not disabled in bootloader configuration | Add missing settings"
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX="(?!(?:[^"\n]*[ \t])?{{ item.name }}=)[^"\n]*?)[ \t]*"'
        replace: '\g<1> {{ item.name }}={{ item.value }}"'
      loop:
        - { name: selinux, value: '1' }
        - { name: security, value: selinux }
      notify: Grub update

- name: "1.3.1.3 | PATCH | Ensure SELinux policy is configured"
  when:
    - suse16cis_rule_1_3_1_3
    - not suse16cis_selinux_disable
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.3.1.3
    - NIST800-53R5_AC-3
    - selinux
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^\s*SELINUXTYPE\s*='
    line: "SELINUXTYPE={{ suse16cis_selinux_policy }}"
    create: true
    owner: root
    group: root
    mode: 'u-x,go-wx'

- name: "1.3.1.4 | PATCH | Ensure the MCS Translation Service (mcstrans) is not installed"
  when:
    - suse16cis_rule_1_3_1_4
    - not suse16cis_selinux_disable
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.3.1.4
    - NIST800-53R5_AC-3
    - selinux
  ansible.builtin.package:
    name: mcstrans
    state: absent

- name: "1.3.1.5 | PATCH | Ensure the SELinux mode is not disabled"
  when: suse16cis_rule_1_3_1_5
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.3.1.5
    - NIST800-53R5_CM-7
  block:
    - name: "1.3.1.5 | PATCH | Ensure the SELinux mode is not disabled | Set config to enforcing if disabled"
      ansible.builtin.replace:
        path: /etc/selinux/config
        regexp: '^SELINUX=disabled'
        replace: 'SELINUX=enforcing'

    - name: "1.3.1.5 | PATCH | Ensure the SELinux mode is not disabled | Set running mode to enforcing"
      when: not system_is_container
      ansible.builtin.command: setenforce 1
      changed_when: false
      failed_when: false

- name: "1.3.1.6 | PATCH | Ensure the SELinux mode is enforcing"
  when: suse16cis_rule_1_3_1_6
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rule_1.3.1.6
    - NIST800-53R5_CM-7
  block:
    - name: "1.3.1.6 | PATCH | Ensure the SELinux mode is enforcing | Set config to enforcing"
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX\s*='
        line: 'SELINUX=enforcing'

    - name: "1.3.1.6 | PATCH | Ensure the SELinux mode is enforcing | Flag a relabel on next boot"
      when: not system_is_container
      ansible.builtin.file:
        path: /etc/selinux/.autorelabel
        state: touch
        owner: root
        group: root
        mode: 'u-x,go-wx'
        access_time: preserve
        modification_time: preserve

    - name: "1.3.1.6 | PATCH | Ensure the SELinux mode is enforcing | Set running mode to enforcing"
      when: not system_is_container
      ansible.builtin.command: setenforce 1
      changed_when: false
      failed_when: false

    - name: "1.3.1.6 | PATCH | Ensure the SELinux mode is enforcing | Reboot required"
      when: not system_is_container
      ansible.builtin.set_fact:
        change_requires_reboot: true

- name: "1.3.1.7 | PATCH | Ensure SETroubleshoot is not installed"
  when: suse16cis_rule_1_3_1_7
  tags:
    - level1-server
    - patch
    - rule_1.3.1.7
    - NIST800-53R5_AC-3
  ansible.builtin.package:
    name: setroubleshoot
    state: absent

- name: "1.3.1.8 | AUDIT | Ensure no unconfined services exist"
  when: suse16cis_rule_1_3_1_8
  tags:
    - level2-server
    - level2-workstation
    - audit
    - rule_1.3.1.8
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "1.3.1.8 | AUDIT | Ensure no unconfined services exist | Get unconfined services"
      ansible.builtin.shell: |
        set -o pipefail
        ps -eZ | grep unconfined_service_t
      changed_when: false
      failed_when: false
      args:
        executable: "{{ suse16cis_shell_executable }}"
      register: discovered_unconfined_services

    - name: "1.3.1.8 | AUDIT | Ensure no unconfined services exist | Display unconfined services"
      when: discovered_unconfined_services.stdout | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! Unconfined services found. Review and confine as appropriate per site policy."
          - "{{ discovered_unconfined_services.stdout_lines }}"

    - name: "1.3.1.8 | AUDIT | Ensure no unconfined services exist | Warn Count"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '1.3.1.8'
