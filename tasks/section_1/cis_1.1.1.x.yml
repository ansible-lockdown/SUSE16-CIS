- name: "1.1.1.10 | AUDIT | Ensure unused filesystems kernel modules are not available"
  when: suse16cis_rule_1_1_1_10
  tags:
    - level1-server
    - level1-workstation
    - manual
    - audit
    - rule_1.1.1.10
    - NIST800-53R5_CM-7
  block:
    - name: "1.1.1.10 | AUDIT | Ensure unused filesystems kernel modules are not available | Get mounted filesystem types"
      ansible.builtin.shell: |
        set -o pipefail
        findmnt -klo FSTYPE | sort -u
      changed_when: false
      failed_when: false
      args:
        executable: "{{ suse16cis_shell_executable }}"
      register: discovered_mounted_fs_types

    - name: "1.1.1.10 | AUDIT | Ensure unused filesystems kernel modules are not available | Display mounted filesystem types"
      ansible.builtin.debug:
        msg:
          - "Warning!! Review mounted filesystem types below. Disable kernel modules for any not required by site policy."
          - "{{ discovered_mounted_fs_types.stdout_lines }}"

    - name: "1.1.1.10 | AUDIT | Ensure unused filesystems kernel modules are not available | Warn Count"
      ansible.builtin.import_tasks:
        file: warning_facts.yml
      vars:
        warn_control_id: '1.1.1.10'
