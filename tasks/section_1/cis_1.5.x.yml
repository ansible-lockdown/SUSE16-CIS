---

- name: "1.5.1 | PATCH | Ensure fs.protected_hardlinks is configured"
  when: suse16cis_rule_1_5_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.1
    - NIST800-53R5_CM-6
  ansible.posix.sysctl:
    name: fs.protected_hardlinks
    value: '1'
    state: present
    sysctl_file: "{{ suse16cis_sysctl_kernel_conf }}"
    reload: true
    sysctl_set: true
    ignoreerrors: true

- name: "1.5.2 | PATCH | Ensure fs.protected_symlinks is configured"
  when: suse16cis_rule_1_5_2
  tags:
    - level2-server
    - level2-workstation
    - patch
    - rule_1.5.2
    - NIST800-53R5_CM-6
