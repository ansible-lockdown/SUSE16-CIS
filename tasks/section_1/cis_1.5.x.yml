- name: "1.5.8 | PATCH | Ensure systemd-coredump ProcessSizeMax is configured"
  when: suse16cis_rule_1_5_8
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.8
    - NIST800-53R5_CM-6
  block:
    - name: "1.5.8 | PATCH | Ensure systemd-coredump ProcessSizeMax is configured | Ensure conf.d directory exists"
      ansible.builtin.file:
        path: /etc/systemd/coredump.conf.d
        state: directory
        owner: root
        group: root
        mode: 'go-w'

    - name: "1.5.8 | PATCH | Ensure systemd-coredump ProcessSizeMax is configured | Ensure [Coredump] section header"
      ansible.builtin.lineinfile:
        path: /etc/systemd/coredump.conf.d/60-cis.conf
        line: '[Coredump]'
        create: true
        owner: root
        group: root
        mode: 'go-wx'
        insertbefore: BOF

    - name: "1.5.8 | PATCH | Ensure systemd-coredump ProcessSizeMax is configured | Set ProcessSizeMax=0"
      ansible.builtin.lineinfile:
        path: /etc/systemd/coredump.conf.d/60-cis.conf
        regexp: '^ProcessSizeMax\s*='
        line: 'ProcessSizeMax=0'
        insertafter: '^\[Coredump\]'
      notify: Reload systemctl

- name: "1.5.9 | PATCH | Ensure systemd-coredump Storage is configured"
  when: suse16cis_rule_1_5_9
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_1.5.9
    - NIST800-53R5_CM-6
  block:
    - name: "1.5.9 | PATCH | Ensure systemd-coredump Storage is configured | Ensure conf.d directory exists"
      ansible.builtin.file:
        path: /etc/systemd/coredump.conf.d
        state: directory
        owner: root
        group: root
        mode: 'go-w'

    - name: "1.5.9 | PATCH | Ensure systemd-coredump Storage is configured | Ensure [Coredump] section header"
      ansible.builtin.lineinfile:
        path: /etc/systemd/coredump.conf.d/60-cis.conf
        line: '[Coredump]'
        create: true
        owner: root
        group: root
        mode: 'go-wx'
        insertbefore: BOF

    - name: "1.5.9 | PATCH | Ensure systemd-coredump Storage is configured | Set Storage=none"
      ansible.builtin.lineinfile:
        path: /etc/systemd/coredump.conf.d/60-cis.conf
        regexp: '^Storage\s*='
        line: 'Storage=none'
        insertafter: '^\[Coredump\]'
      notify: Reload systemctl
