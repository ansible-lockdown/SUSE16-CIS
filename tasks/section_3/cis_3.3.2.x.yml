---

- name: "3.3.2.1 | PATCH | Ensure net.ipv6.conf.all.forwarding is configured"
  when: suse16cis_rule_3_3_2_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - rule_3.3.2.1
    - NIST800-53R5_CM-6
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '0'
    sysctl_set: true
    sysctl_file: "{{ suse16cis_sysctl_network_conf }}"
    state: present
    reload: true
    ignoreerrors: true

