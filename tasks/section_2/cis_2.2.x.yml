---

- name: "2.2.1 | PATCH | Ensure ftp client is not installed"
  when:
    - not suse16cis_ftp_client
    - suse16cis_rule_2_2_1
  tags:
    - level1-server
    - level1-workstation
    - patch
    - ftp
    - rule_2.2.1
    - NIST800-53R5_CM-7
  ansible.builtin.package:
    name: ftp
    state: absent

- name: "2.2.2 | PATCH | Ensure ldap client is not installed"
  when:
    - not suse16cis_ldap_clients_required
    - suse16cis_rule_2_2_2
  tags:
    - level2-server
    - level2-workstation
    - patch
    - ldap
    - rule_2.2.2
    - NIST800-53R5_CM-7
  ansible.builtin.package:
    name:
      - openldap2_6-client
    state: absent

- name: "2.2.3 | PATCH | Ensure nis client is not installed"
  when:
    - not suse16cis_nis_client_required
    - suse16cis_rule_2_2_3
  tags:
    - level1-server
    - level1-workstation
    - patch
    - ldap
    - rule_2.2.3
    - NIST800-53R5_CM-7
  ansible.builtin.package:
    name: ypbind
    state: absent

- name: "2.2.4 | PATCH | Ensure telnet client is not installed"
  when:
    - not suse16cis_telnet_required
    - suse16cis_rule_2_2_4
  tags:
    - level1-server
    - level1-workstation
    - patch
    - telnet
    - rule_2.2.4
    - NIST800-53R5_CM-7
  ansible.builtin.package:
    name: telnet
    state: absent

- name: "2.2.5 | PATCH | Ensure tftp client is not installed"
  when:
    - not suse16cis_tftp_client
    - suse16cis_rule_2_2_5
  tags:
    - level1-server
    - level1-workstation
    - patch
    - tftp
    - rule_2.2.5
    - NIST800-53R5_CM-7
  ansible.builtin.package:
    name: tftp
    state: absent
