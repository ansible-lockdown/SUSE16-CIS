## System functionality configuration variables
##
## There are certain functionalities of a system
## that may require either to skip certain CIS rules
## or install certain packages.
## Set the respective variable to `true` in order to
## enable a certain functionality on the system

# This variable governs whether specific CIS rules
# concerned with acceptance and routing of packages
# are skipped.
suse16cis_is_router: false

## IPv4 requirement toggle
# This variable governs whether ipv4 is enabled or disabled.
suse16cis_ipv4_required: true

## IPv6 requirement toggle
# This variable governs whether ipv6 is enabled or disabled.
suse16cis_ipv6_required: false

##
## Section 1 Control Variables
##

## Ability to enable debug on mounts to assist in troubleshooting
# Mount point changes are set based upon facts created in Prelim
# these then build the variable and options that is passed to the handler to set the mount point for the controls in section1.
suse16cis_debug_mount_data: false

## Controls 1.1.2.1.x - /tmp
# How /tmp mount options are managed:
#  - auto:  discover it - a tmp.mount unit if /tmp is mounted by one, otherwise /etc/fstab
#  - true:  always use the tmp.mount systemd unit (creates it if needed)
#  - false: always use /etc/fstab
# These /tmp settings will include nosuid,nodev,noexec to conform to CIS standards.
suse16cis_tmp_svc: auto

## Controls 1.3.1.x - selinux
# selinux security policies define what system resources applications can access and their privileges.
# This automatically limits the damage that the software can do to files accessible by the calling user.
# The following variables are related to the set of rules from section 1.6.1.x

## Controls 1.3.1.x - SELinux

# This variable disables the implementation of rules 1.3.1.1 to 1.3.1.6,
# for systems where SELinux is deliberately not in use
suse16cis_selinux_disable: false

# SELinux policy type written to /etc/selinux/config by Control 1.3.1.3.
# The benchmark accepts `targeted` or `mls`.
suse16cis_selinux_policy: targeted

## Controls 1.4.x - Boot password
#
# THIS VARIABLE SHOULD BE CHANGED AND INCORPORATED INTO VAULT
# THIS VALUE IS WHAT THE ROOT PW WILL BECOME!!!!!!!!
# HAVING THAT PW EXPOSED IN RAW TEXT IS NOT SECURE!!!!
suse16cis_grub_user: root
suse16cis_grub_user_file: /etc/grub.d/40_custom
suse16cis_bootloader_password_hash: "grub.pbkdf2.sha512.changethispassword"  # pragma: allowlist secret
suse16cis_set_boot_pass: false

# True when the system uses BIOS/legacy boot; prelim may override when EFI is detected
suse16cis_legacy_boot: false

## Controls 1.5.x
# Ability to set file in which the kernel sysctl changes are placed
suse16cis_sysctl_kernel_conf: /etc/sysctl.d/98_cis_kernel.conf

## Control 1.6
# This variable contains the value to be set as the system-wide crypto policy. Current rule enforces NOT USING
# 'LEGACY' value(as it is less secure, it just ensures compatibility with legacy systems), therefore
# possible values are, as explained by RedHat docs:
#  -'DEFAULT': reasonable default policy for today's standards (balances usability and security)
#  -'FUTURE': conservative security level that is believed to withstand any near-term future attacks
#  -'FIPS': A level that conforms to the FIPS140-2 requirements
suse16cis_crypto_policy: 'DEFAULT'
## Control 1.6
# This variable contains the value of the crypto policy module(combinations of policies and
# sub-policies) to be allowed as default setting. Allowed options are defined in 'vars/main.yml' file,
# using 'suse16cis_allowed_crypto_policies_modules' variable.
suse16cis_additional_crypto_policy_module: ''
# Updated at runtime by the Update Crypto Policy handler; initial value matches policy only
suse16cis_full_crypto_policy: "{{ suse16cis_crypto_policy }}"

## Controls 1.7.x  - Warning banners
# The controls 1.7.x set various warning banners and protect the respective files
# by tightening the access rights.

# This variable specifies the warning banner displayed to the user
# after local login, remote login, and as motd (message of the day)
# Note that the banner text must not contain the below items in order to be
# compliant with CIS: \m, \r, \s, \v or references to the OS platform
suse16cis_warning_banner: |
        Authorized users only. All activity may be monitored and reported.

# This variable governs, whether dynamic motd is disabled (as required by control 1.7.1)
suse16cis_disable_dynamic_motd: true

## Controls 1.8.x - Settings for GDM
## Graphical/Gnome interface installed
suse16cis_gui: "{{ prelim_gnome_present.stat.exists | default(false) }}"

# This variable specifies the GNOME configuration database file to which configurations are written.
# (See https://help.gnome.org/admin/system-admin-guide/stable/dconf-keyfiles.html.en)
# The default database is `local`.
suse16cis_dconf_db_name: "{{ prelim_dconf_db | default('local') }}"
# This variable governs the number of seconds of inactivity before the screen goes blank.
suse16cis_screensaver_idle_delay: 900
# This variable governs the number of seconds the screen remains blank before it is locked.
suse16cis_screensaver_lock_delay: 5

##
## Section 2 Control Variables
##

## Control 2.3.1.1
# This variable choses the tool used for time synchronization
# The two options are `chronyd`and `systemd-timesyncd`.
suse16cis_time_sync_tool: "chronyd"

## Controls 2.3.x - Configure time pools & servers for chronyd and timesyncd
# The following variable represents a list of time server pools used
# for configuring chronyd and timesyncd.
# Each list item contains two settings, `name` (the domain name of the pool) and synchronization `options`.
# The default setting for the `options` is `iburst maxsources 4` -- please refer to the documentation
# of the time synchronization mechanism you are using.
suse16cis_time_pool_name: time.nist.gov
suse16cis_time_pool_options: iburst maxsources 4
# The following variable represents a list of time servers used
# for configuring chronyd and timesyncd
# Each list item contains two settings, `name` (the domain name of the server) and synchronization `options`.
# The default setting for the `options` is `iburst` -- please refer to the documentation
# of the time synchronization mechanism you are using.
suse16cis_time_servers:
  - name: time-a-g.nist.gov
    options: iburst
  - name: time-b-g.nist.gov
    options: iburst
  - name: time-c-g.nist.gov
    options: iburst

##
## Section 3 Control Variables
##
## Control 3.1.3 - Ensure bluetooth Services are not in use
# This control managed how the bluetooth service is managed
# Options are
# true to leave installed if exists not changes take place
# false - this removes the package
# mask - if a dependency for product so cannot be removed
suse16cis_bluetooth_service: false
suse16cis_bluetooth_mask: false

## Control 3.3.x - Networking configuration
# This variable contains the path to the file in which, sysctl saves its configurations.
# Its default value is `/etc/sysctl.conf`.
suse16cis_sysctl_network_conf: /etc/sysctl.conf

##
## Section 4 Control Variables
##

## Controls 4.1.x, 4.2.x- Firewall configuration
# This variable represents the toggle for which firewall package is used.
# This only allows firewalld setting to anything else will skip these controls in section 4
suse16cis_firewall_package: "firewalld"
# Audit bridge / Goss expect this alias (see lockdown_audit.yml.j2)
suse16cis_firewall: "firewalld"

# Set this to be the default zone for firewalld
suse16cis_default_zone: public

# Set the zone name for the loopback interface. This is used to set the zone for the loopback interface.
suse16cis_loopback_zone: trusted

